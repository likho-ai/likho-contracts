# NATS JetStream layout. Streams are created by likho-infra (nats/streams.sh);
# each service creates its own durable consumers at start-up, as listed here.
#
# Rules
#   * The NATS subject is fixed per event type (below); the CloudEvent "type" carries the version.
#   * Publishers set the Nats-Msg-Id header to the CloudEvent id (duplicate window: 2 minutes).
#   * Consumers acknowledge explicitly and must be idempotent on the event id.

streams:
  LIKHO:
    description: Business events, kept 30 days
    subjects: ["likho.media.*", "likho.transcription.*", "likho.vocabulary.*", "likho.insights.*", "likho.import.*", "likho.recording.*", "likho.settings.*", "likho.dead"]
    max_age: 30d
  LIKHO_LIVE:
    description: Live transcript lines, only useful while a job runs
    subjects: ["likho.live.*"]
    max_age: 1d
  LIKHO_KEEP:
    description: Corrections made by people (training data), never expired
    subjects: ["likho.transcript.*"]

events:
  likho.media.uploaded.v1:
    subject: likho.media.uploaded
    stream: LIKHO
    producer: likho-media
    consumers: [likho-analytics]
  likho.media.ready.v1:
    subject: likho.media.ready
    stream: LIKHO
    producer: likho-media
    consumers: [likho-api, likho-analytics]
  likho.media.failed.v1:
    subject: likho.media.failed
    stream: LIKHO
    producer: likho-media
    consumers: [likho-api, likho-analytics]
  likho.transcription.requested.v1:
    subject: likho.transcription.requested
    stream: LIKHO
    producer: likho-api
    consumers: [likho-transcription, likho-analytics]
  likho.transcription.started.v1:
    subject: likho.transcription.started
    stream: LIKHO
    producer: likho-transcription
    consumers: [likho-api, likho-analytics]
  likho.transcription.segment.v1:
    subject: likho.live.segment
    stream: LIKHO_LIVE
    producer: likho-transcription
    # likho-api relays the line to browsers; likho-language counts the glossary terms and spellings in it.
    consumers: [likho-api, likho-language, likho-analytics]
  likho.transcription.completed.v1:
    subject: likho.transcription.completed
    stream: LIKHO
    producer: likho-transcription
    consumers: [likho-api, likho-search, likho-insights, likho-connector-ameyo, likho-analytics]
  likho.transcription.failed.v1:
    subject: likho.transcription.failed
    stream: LIKHO
    producer: likho-transcription
    consumers: [likho-api, likho-analytics]
  likho.vocabulary.updated.v1:
    subject: likho.vocabulary.updated
    stream: LIKHO
    producer: likho-language
    consumers: [likho-transcription, likho-analytics]
  likho.transcript.corrected.v1:
    subject: likho.transcript.corrected
    stream: LIKHO_KEEP
    producer: likho-api
    consumers: [likho-search, likho-analytics]
  likho.import.requested.v1:
    subject: likho.import.requested
    stream: LIKHO
    producer: likho-api
    consumers: [likho-connector-ameyo, likho-analytics]
  likho.import.completed.v1:
    subject: likho.import.completed
    stream: LIKHO
    producer: likho-connector-ameyo
    consumers: [likho-api, likho-analytics]
  likho.import.failed.v1:
    subject: likho.import.failed
    stream: LIKHO
    producer: likho-connector-ameyo
    consumers: [likho-api, likho-analytics]
  likho.recording.deleted.v1:
    subject: likho.recording.deleted
    stream: LIKHO
    producer: likho-api
    consumers: [likho-search, likho-connector-ameyo, likho-analytics]
  likho.recording.updated.v1:
    subject: likho.recording.updated
    stream: LIKHO
    producer: likho-api
    # The recording's facts (source, campaign, agent, ...) travel beside its lines in the index.
    consumers: [likho-search, likho-analytics]
  likho.insights.completed.v1:
    subject: likho.insights.completed
    stream: LIKHO
    producer: likho-insights
    # likho-api tells the open pages; the insights themselves are fetched over gRPC.
    consumers: [likho-api, likho-analytics]
  likho.insights.failed.v1:
    subject: likho.insights.failed
    stream: LIKHO
    producer: likho-insights
    consumers: [likho-api, likho-analytics]
  likho.settings.changed.v1:
    subject: likho.settings.changed
    stream: LIKHO
    producer: likho-api
    consumers: [likho-connector-ameyo, likho-insights, likho-analytics]

# Durable consumer settings. Name = <service>-<last part of the subject>.
consumer_defaults:
  ack_policy: explicit
  ack_wait: 30s
  max_deliver: 5

consumer_overrides:
  # The job queue: one worker gets each job and acknowledges only when the transcript is stored.
  # While it works it sends "in progress" every 30 s, so a long call is not handed to someone else.
  likho-transcription-requested:
    ack_wait: 60s
    max_deliver: 3
    # A pull consumer shared by all workers. Each worker fetches one job, and the next only when it
    # is done, so every worker runs one transcription at a time. (max_ack_pending is not used for
    # this: it counts for the whole consumer and would make all workers take turns.)
    on_exhausted: publish likho.dead and likho.transcription.failed
