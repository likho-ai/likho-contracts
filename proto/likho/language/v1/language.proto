syntax = "proto3";

package likho.language.v1;

import "google/protobuf/timestamp.proto";
import "likho/common/v1/common.proto";

// Owned by likho-language: Hinglish rules, the spelling table, the glossary and the language policy.
// It also counts how often each term and spelling is heard, from the lines the workers publish.
service LanguageService {
  // Writes one line in Hinglish using the rules and the workspace's spelling table.
  rpc Transliterate(TransliterateRequest) returns (TransliterateResponse);
  rpc TransliterateBatch(TransliterateBatchRequest) returns (TransliterateBatchResponse);
  // Names the speech model should listen for.
  rpc GetHotwords(GetHotwordsRequest) returns (GetHotwordsResponse);
  // Decides which language to decode as, from what was detected.
  rpc ResolveDecodePolicy(ResolveDecodePolicyRequest) returns (ResolveDecodePolicyResponse);

  rpc ListGlossaryTerms(ListGlossaryTermsRequest) returns (ListGlossaryTermsResponse);
  rpc UpsertGlossaryTerm(UpsertGlossaryTermRequest) returns (UpsertGlossaryTermResponse);
  rpc DeleteGlossaryTerm(DeleteGlossaryTermRequest) returns (DeleteGlossaryTermResponse);
  // Many terms at once (a CSV import): one transaction, one version, one event.
  rpc ImportGlossaryTerms(ImportGlossaryTermsRequest) returns (ImportGlossaryTermsResponse);

  rpc ListSpellings(ListSpellingsRequest) returns (ListSpellingsResponse);
  rpc UpsertSpelling(UpsertSpellingRequest) returns (UpsertSpellingResponse);
  rpc DeleteSpelling(DeleteSpellingRequest) returns (DeleteSpellingResponse);
  rpc ImportSpellings(ImportSpellingsRequest) returns (ImportSpellingsResponse);
}

message TransliterateRequest {
  string workspace_id = 1;
  string text = 2;
  likho.common.v1.Script source_script = 3;
}

message TransliterateResponse {
  string text_roman = 1;
  // Version of the spelling table that was applied.
  uint64 vocabulary_version = 2;
}

message TransliterateBatchRequest {
  string workspace_id = 1;
  repeated string texts = 2;
  likho.common.v1.Script source_script = 3;
}

message TransliterateBatchResponse {
  // Same order and length as the request.
  repeated string texts_roman = 1;
  uint64 vocabulary_version = 2;
}

message GetHotwordsRequest {
  string workspace_id = 1;
  string language = 2;
}

message GetHotwordsResponse {
  repeated string terms = 1;
  uint64 vocabulary_version = 2;
}

message ResolveDecodePolicyRequest {
  string workspace_id = 1;
  string detected = 2;
  double probability = 3;
  repeated likho.common.v1.LanguageCandidate candidates = 4;
}

message ResolveDecodePolicyResponse {
  string decode_as = 1;
  // False for English calls, which stay as they are.
  bool transliterate = 2;
}

message GlossaryTerm {
  string id = 1;
  // A name, or a whole phrase (several words), in the script of the audio.
  string term = 2;
  string language = 3;
  bool enabled = 4;
  string note = 5;
  // Decided by the service: a term with spaces.
  bool is_phrase = 6;
  // How many transcript lines contained the term, and when the last one was heard.
  uint64 heard = 7;
  google.protobuf.Timestamp last_heard_at = 8;
}

message ListGlossaryTermsRequest {
  string workspace_id = 1;
}

message ListGlossaryTermsResponse {
  repeated GlossaryTerm terms = 1;
}

message UpsertGlossaryTermRequest {
  string workspace_id = 1;
  // Empty id creates a new term, or updates the one with the same text. A term saved without an id
  // is always enabled; "enabled" is only taken from the request when an id is given.
  GlossaryTerm term = 2;
}

message UpsertGlossaryTermResponse {
  GlossaryTerm term = 1;
}

message DeleteGlossaryTermRequest {
  string workspace_id = 1;
  string id = 2;
}

message DeleteGlossaryTermResponse {}

message ImportGlossaryTermsRequest {
  string workspace_id = 1;
  // Each term is created, or updates the one with the same text (ids are ignored).
  repeated GlossaryTerm terms = 2;
}

message ImportGlossaryTermsResponse {
  uint32 added = 1;
  uint32 updated = 2;
  uint64 vocabulary_version = 3;
}

message Spelling {
  string id = 1;
  // What the model writes, in the source script. Several words make a phrase.
  string source = 2;
  // How it must appear in Hinglish.
  string target = 3;
  bool is_phrase = 4;
  bool enabled = 5;
  // How many transcript lines the spelling was applied to, and when the last one was heard.
  uint64 applied = 6;
  google.protobuf.Timestamp last_applied_at = 7;
  // The last few lines it was applied to, newest first: what the model wrote and what came out.
  repeated SpellingExample examples = 8;
}

message SpellingExample {
  string recording_id = 1;
  uint32 segment_index = 2;
  // The line as the model wrote it (layer 1) and as it was written in Hinglish (layer 2).
  string before = 3;
  string after = 4;
  google.protobuf.Timestamp heard_at = 5;
}

message ListSpellingsRequest {
  string workspace_id = 1;
}

message ListSpellingsResponse {
  repeated Spelling spellings = 1;
}

message UpsertSpellingRequest {
  string workspace_id = 1;
  // Empty id creates a new spelling, or updates the one with the same source. Same rule for
  // "enabled" as for glossary terms. "is_phrase" is decided by the service (a source with spaces).
  Spelling spelling = 2;
}

message UpsertSpellingResponse {
  Spelling spelling = 1;
}

message DeleteSpellingRequest {
  string workspace_id = 1;
  string id = 2;
}

message DeleteSpellingResponse {}

message ImportSpellingsRequest {
  string workspace_id = 1;
  // Each spelling is created, or updates the one with the same source (ids are ignored).
  repeated Spelling spellings = 2;
}

message ImportSpellingsResponse {
  uint32 added = 1;
  uint32 updated = 2;
  uint64 vocabulary_version = 3;
}
