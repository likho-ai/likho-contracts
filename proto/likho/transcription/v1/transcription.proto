syntax = "proto3";

package likho.transcription.v1;

import "google/protobuf/timestamp.proto";
import "likho/common/v1/common.proto";

// Owned by likho-transcription: runs the speech model and stores both text layers.
service TranscriptionService {
  rpc GetTranscript(GetTranscriptRequest) returns (GetTranscriptResponse);
  // All versions for one recording, newest first.
  rpc ListTranscripts(ListTranscriptsRequest) returns (ListTranscriptsResponse);
  // Transcribes directly and streams lines as they are written (used by the CLI and tests;
  // normal jobs arrive as likho.transcription.requested events).
  rpc Transcribe(TranscribeRequest) returns (stream TranscribeResponse);
  // Rebuilds the Hinglish layer from the saved script layer. The speech model does not run.
  rpc Retransliterate(RetransliterateRequest) returns (RetransliterateResponse);
  // Replaces one line's text in one layer with what a person wrote: a new version of the
  // transcript, the correction kept, likho.transcript.corrected published. When the script
  // layer was corrected the line's Hinglish is derived again; a corrected Hinglish stands as written.
  rpc CorrectSegment(CorrectSegmentRequest) returns (CorrectSegmentResponse);
  // Every correction made to a recording's transcripts, newest first.
  rpc ListCorrections(ListCorrectionsRequest) returns (ListCorrectionsResponse);
  rpc ListEngines(ListEnginesRequest) returns (ListEnginesResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
}

message ModelRef {
  // Registry id, for example "faster-whisper/turbo".
  string registry_id = 1;
  string engine = 2;
  string compute = 3;
}

message TranscriptStats {
  double audio_seconds = 1;
  double elapsed_seconds = 2;
  // Audio seconds written per second of processing.
  double realtime_factor = 3;
  uint32 chunks = 4;
  double silence_skipped_seconds = 5;
}

message Transcript {
  string id = 1;
  string recording_id = 2;
  string job_id = 3;
  uint32 version = 4;
  ModelRef model = 5;
  likho.common.v1.LanguageDetection language = 6;
  likho.common.v1.Script script = 7;
  repeated likho.common.v1.Segment segments = 8;
  TranscriptStats stats = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetTranscriptRequest {
  string id = 1;
}

message GetTranscriptResponse {
  Transcript transcript = 1;
}

message ListTranscriptsRequest {
  string recording_id = 1;
}

message ListTranscriptsResponse {
  // Without segments; fetch one transcript for its lines.
  repeated Transcript transcripts = 1;
}

message TranscribeRequest {
  string recording_id = 1;
  // Empty means the default model.
  string model_registry_id = 2;
  // "auto", or a language code to force.
  string language_policy = 3;
  // The audio to read, as known to likho-media.
  string media_id = 4;
  // Whose glossary, spellings and language policy apply.
  string workspace_id = 5;
}

message TranscribeStarted {
  double audio_seconds = 1;
  likho.common.v1.LanguageDetection language = 2;
}

message TranscribeResponse {
  oneof event {
    TranscribeStarted started = 1;
    likho.common.v1.Segment segment = 2;
    Transcript completed = 3;
  }
}

// The layer of a line a person corrected.
enum Layer {
  LAYER_UNSPECIFIED = 0;
  // The text as spoken, in its script (Devanagari).
  LAYER_SCRIPT = 1;
  // The Hinglish (Latin letters).
  LAYER_ROMAN = 2;
}

// One change a person made to one line. A correction never edits a transcript in place: it
// makes the next version, and the correction itself is kept as training data.
message Correction {
  string id = 1;
  string recording_id = 2;
  // The version the person was looking at, and the version the correction made.
  string transcript_id = 3;
  string corrected_transcript_id = 4;
  uint32 segment_index = 5;
  Layer layer = 6;
  string before = 7;
  string after = 8;
  string user_id = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CorrectSegmentRequest {
  // The version being looked at; it must be the recording's latest.
  string transcript_id = 1;
  uint32 segment_index = 2;
  Layer layer = 3;
  // What the line should read.
  string text = 4;
  string user_id = 5;
  // Whose spellings apply when the Hinglish is re-derived.
  string workspace_id = 6;
}

message CorrectSegmentResponse {
  // The new version, with every line.
  Transcript transcript = 1;
  Correction correction = 2;
}

message ListCorrectionsRequest {
  string recording_id = 1;
}

message ListCorrectionsResponse {
  // Newest first.
  repeated Correction corrections = 1;
}

message RetransliterateRequest {
  string transcript_id = 1;
}

message RetransliterateResponse {
  Transcript transcript = 1;
}

message Engine {
  string registry_id = 1;
  string engine = 2;
  // Which layer the engine writes itself: Devanagari engines need transliteration, Hinglish engines do not.
  likho.common.v1.Script output_script = 3;
  bool available = 4;
  bool is_default = 5;
}

message ListEnginesRequest {}

message ListEnginesResponse {
  repeated Engine engines = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  // False when the job had already finished.
  bool cancelled = 1;
}
