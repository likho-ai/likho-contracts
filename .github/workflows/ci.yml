name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint and build the protos
        run: npm run lint && npm run build
      - name: Breaking changes against main
        if: github.event_name == 'pull_request'
        run: npx buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
      - name: Validate events and streams
        run: npm run validate
      - name: Generate code (TypeScript, Python, Go)
        run: npm run generate
      - name: The committed Python, Go and TypeScript packages match the protos
        run: |
          git add -N packages/python/src packages/go/gen packages/ts/gen
          git diff --exit-code -- packages/python/src packages/go/gen packages/ts/gen
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
      - name: The Go package builds
        working-directory: packages/go
        run: go vet ./... && go build ./...
      - name: The Python package installs and imports
        run: |
          pipx run uv run --no-project --python 3.12 --with ./packages/python python -c "from likho.language.v1 import language_pb2_grpc; from likho.media.v1 import media_pb2; from likho.transcription.v1 import transcription_pb2"
      - name: The TypeScript package installs and imports
        run: |
          tarball="$(cd packages/ts && npm pack --silent --pack-destination "$RUNNER_TEMP")"
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm install --silent "./$tarball" @bufbuild/protobuf
          node --input-type=module -e "
            import { MediaService } from '@likho-ai/contracts/media/v1/media_pb';
            import { TranscriptionService } from '@likho-ai/contracts/transcription/v1/transcription_pb';
            import { LanguageService } from '@likho-ai/contracts/language/v1/language_pb';
            if (!MediaService.method.createUpload || !TranscriptionService.method.transcribe || !LanguageService.method.transliterate) process.exit(1);
          "
